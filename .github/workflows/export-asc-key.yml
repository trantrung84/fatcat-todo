name: Export ASC key (encrypted)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare encryption key
        env:
          TRANSFER_PUBLIC_KEY_B64: 
        run: printf '%s' "$TRANSFER_PUBLIC_KEY_B64" | base64 --decode > transfer-public.pem

      - name: Encrypt the existing App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_P8"
          printf '%s' "$ASC_KEY_P8" > AuthKey.p8
          openssl pkeyutl -encrypt -pubin -inkey transfer-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in AuthKey.p8 -out AuthKey.p8.enc
          rm -f AuthKey.p8 transfer-public.pem

      - name: Upload encrypted key
        uses: actions/upload-artifact@v4
        with:
          name: asc-key-encrypted
          path: AuthKey.p8.enc
          retention-days: 1
          if-no-files-found: error
