name: Build Android APK

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Firebase config (optional – analytics stays off without it)
        if: ${{ env.GOOGLE_SERVICES_JSON != '' }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Build debug APK (for testing)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../FatCatTodo-debug.apk

      - name: Build signed release AAB + APK (only if signing secrets exist)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          SIGN="-Pandroid.injected.signing.store.file=$PWD/release.jks -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD -Pandroid.injected.signing.key.alias=$KEY_ALIAS -Pandroid.injected.signing.key.password=$KEY_PASSWORD"
          ./gradlew bundleRelease assembleRelease --no-daemon $SIGN
          cp app/build/outputs/bundle/release/app-release.aab ../FatCatTodo-release.aab
          cp app/build/outputs/apk/release/app-release.apk ../FatCatTodo-release.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: fatcat-todo-build
          path: |
            FatCatTodo-debug.apk
            FatCatTodo-release.aab
            FatCatTodo-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release (download APK straight to your phone)
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Fat Cat Todo – build ${{ github.run_number }}
          body: |
            Debug APK for testing (Android 7+). Download **FatCatTodo-debug.apk**, open it and allow "Install unknown apps".
            The signed **FatCatTodo-release.aab** (when present) is the file to upload to Google Play Console.
            Commit: ${{ github.sha }}
          files: |
            FatCatTodo-debug.apk
            FatCatTodo-release.aab
          fail_on_unmatched_files: false
          make_latest: true
