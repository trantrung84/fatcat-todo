<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF3EC">
<title>Fat Cat Todo</title>
<style>
/*__FONTS__*/
:root{
  --bg:#FFF3EC;--card:#FFFBF8;--card2:#FCE6DA;--primary:#F07F6E;--primary-d:#B8493A;--primary-l:#FBDCD5;--onp:#fff;--accent:#FCD9C8;--accent-l:#FDEDE4;--deco:#F2B48C;
  --ink:#4A2C24;--ink2:#8A675B;--line:#5A3A30;--border:#F1D3C6;--border2:#E9BFAE;
  --mint:#5CC08F;--mint-d:#2E8A5E;--warn:#E0604A;--warn-d:#B53D2A;--warn-l:#FDE3DD;
  --shadow:0 6px 18px rgba(120,60,40,.08);--r:24px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --fh:"Baloo 2","Nunito",system-ui,sans-serif;--fb:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E9DCD4}
html[data-theme="dark"],html[data-theme="dark"] body{background:#111}
body{font-family:var(--fb);font-weight:600;color:var(--ink);font-size:16px;line-height:1.35;overscroll-behavior:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,.fh{font-family:var(--fh);font-weight:800;letter-spacing:-.1px}
#app{max-width:480px;margin:0 auto;height:100%;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
@media (min-width:520px){#app{height:calc(100% - 32px);margin-top:16px;border-radius:32px;box-shadow:0 20px 60px rgba(60,30,20,.18)}}
#screen{display:flex;flex-direction:column;flex:1;min-height:0}
img.spr{display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
/* top bar */
.topbar{display:flex;align-items:center;gap:8px;padding:calc(10px + var(--sat)) 16px 4px;position:relative;z-index:2}
.topbar .grow{flex:1;min-width:0}
.topbar h1{font-size:24px;margin:0;line-height:1.1;display:flex;align-items:center;gap:4px;white-space:nowrap}
.homebar{padding:calc(6px + var(--sat)) 16px 0 6px;align-items:flex-end}
.homebar .peek{width:88px;height:auto;margin-bottom:-26px;flex:none;position:relative;z-index:3}
.homebar .grow{padding-bottom:10px}
.homebar h1{font-size:22px}
.homebar .obtn{width:42px;height:42px;border-radius:14px}
.datepill{display:inline-flex;align-items:center;gap:5px;margin-top:4px;padding:3px 10px;border-radius:12px;border:1.5px solid var(--border2);background:var(--card);font-size:13px;font-weight:700;color:var(--ink2)}
.datepill svg{width:15px;height:15px;color:var(--primary-d)}
.paw{width:30px;height:28px;position:relative;display:inline-grid;place-items:center;flex:none}
.paw svg{position:absolute;inset:0;width:100%;height:100%}
.paw b{position:relative;font-family:var(--fh);font-size:13px;color:var(--onp);margin-top:7px}
.obtn{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--line);border:1.8px solid var(--border2);background:var(--card);box-shadow:0 2px 0 var(--border)}
.obtn:active{transform:translateY(1px);box-shadow:none}
.obtn svg{width:23px;height:23px}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 14px calc(140px + var(--sab));-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:var(--r);border:1.8px solid var(--border);box-shadow:var(--shadow);padding:12px;margin-bottom:14px;position:relative}
/* hero */
.hero{display:flex;align-items:center;gap:8px;padding:10px 14px 10px 6px;margin-top:4px}
.hero img{width:104px;flex:none;margin:-6px 0}
.bubble{position:relative;background:var(--accent-l);border:1.5px solid var(--border);border-radius:18px;padding:8px 12px;font-size:15px;font-weight:800}
.bubble:before{content:"";position:absolute;left:-8px;top:15px;width:12px;height:12px;background:var(--accent-l);border-left:1.5px solid var(--border);border-bottom:1.5px solid var(--border);transform:rotate(45deg)}
.prog{margin-top:9px;display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink2);font-weight:800}
.bar{flex:1;height:10px;border-radius:6px;background:var(--accent-l);overflow:hidden;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--mint);border-radius:6px;transition:width .45s}
/* calendar */
.calhead{display:flex;align-items:center;gap:4px;margin-bottom:6px}
.calhead .title{font-family:var(--fh);font-weight:800;font-size:18px;flex:1;padding-left:2px;white-space:nowrap}
.seg{display:inline-flex;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:2px}
.seg button{min-width:36px;height:32px;border-radius:11px;font-size:13.5px;font-weight:800;color:var(--ink2);padding:0 10px;font-family:var(--fb)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--onp)}
.chip{height:32px;border-radius:12px;padding:0 11px;font-size:13.5px;font-weight:800;background:var(--primary-l);color:var(--primary-d);border:1.5px solid transparent}
.small{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--line)}
.small svg{width:20px;height:20px}
.calhead .chip{height:28px;font-size:12px;padding:0 8px;border-radius:10px}
.calhead .seg button{font-family:var(--fh);font-size:15px;height:30px;padding:0 9px}
.week,.month{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;touch-action:pan-y}
.dcell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 6px;border-radius:16px;position:relative;min-height:44px;border:1.8px solid transparent}
.dcell .wd{font-size:12px;color:var(--ink2);font-weight:800}
.dcell .num{font-family:var(--fh);font-size:18px;font-weight:800;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;line-height:1}
.dcell.today .num{background:var(--primary);color:var(--onp)}
.dcell.sel{background:var(--primary-l);border-color:var(--border2)}
.dcell.out{opacity:.35}
.dcell .face{width:28px;height:28px}
.month .dcell{padding:3px 0;min-height:56px;border-radius:13px}
.month .dcell .num{width:26px;height:26px;font-size:15px;border-radius:9px}
.month .dcell .face{width:22px;height:22px}
.month .wdh{font-size:12px;color:var(--ink2);font-weight:800;text-align:center;padding:2px 0 4px}
.dcell.drop{background:var(--primary-l);border-color:var(--primary)}
/* sections */
.sec{padding-top:0;margin-top:22px}
.sechead{display:flex;align-items:center;gap:6px;margin:0 -12px 8px;padding:0 12px 0 0;min-height:44px}
.tabpill{display:inline-flex;align-items:center;gap:7px;background:var(--accent-l);border:1.8px solid var(--border);border-left:0;border-top:0;border-radius:var(--r) 0 20px 0;padding:7px 14px 7px 13px;margin-top:-1.8px;color:var(--ink);text-align:left}
.tabpill svg{width:19px;height:19px;color:var(--primary-d)}
.tabpill h2{margin:0;font-size:16.5px;line-height:1.1}
.tabpill .chev{width:16px;height:16px;color:var(--ink2);transition:transform .25s}
.tabpill[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.collapse{display:grid;grid-template-rows:1fr;transition:grid-template-rows .28s ease}
.collapse.shut{grid-template-rows:0fr}
.collapse>.cin{overflow:hidden;min-height:0}
.sec.shut .sechead{margin-bottom:-4px}
.tabpill .cnt{font-family:var(--fh);font-size:13px;font-weight:800;color:var(--ink2);background:var(--card);border-radius:10px;min-width:26px;padding:1px 7px;text-align:center}
.sechead .sp{flex:1}
.deco{position:absolute;pointer-events:none;z-index:1}
.addbtn{height:36px;border-radius:14px;padding:0 12px 0 8px;display:inline-flex;align-items:center;gap:3px;font-family:var(--fh);font-weight:800;font-size:15px;color:var(--primary-d);background:var(--primary-l);border:1.8px solid var(--border2);position:relative;z-index:2}
.addbtn svg{width:20px;height:20px}
ul.list{list-style:none;margin:0;padding:0;min-height:4px;border-radius:14px;transition:background .15s}
ul.list.dz{min-height:56px;outline:2px dashed var(--border2);outline-offset:-2px}
ul.list.dz.over{background:var(--primary-l);outline-color:var(--primary)}
.row{display:flex;align-items:center;min-height:56px;border-bottom:1.5px solid var(--border);background:var(--card);position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.row:last-child{border-bottom:0}
.grip{width:24px;height:44px;display:grid;place-items:center;color:var(--ink2);opacity:.5;touch-action:none;flex:none}
.grip svg{width:16px;height:16px}
.ck{width:46px;height:46px;display:grid;place-items:center;flex:none}
.ck .box{width:30px;height:30px;border-radius:50%;border:2.4px solid var(--primary-d);display:grid;place-items:center;transition:transform .2s,background .2s;background:var(--card)}
.ck .box svg{width:19px;height:19px;opacity:0;transform:scale(.4);transition:all .25s}
.row.done .ck .box{background:var(--mint);border-color:var(--mint-d)}
.row.done .ck .box svg{opacity:1;transform:scale(1)}
.row.pop .ck .box{animation:pop .42s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.tbody{flex:1;min-width:0;padding:9px 2px;cursor:pointer}
.ttl{font-size:16.5px;font-weight:700;overflow-wrap:anywhere}
.row.done .ttl{text-decoration:line-through;color:var(--ink2);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--ink2);background:var(--accent-l);border-radius:9px;padding:2px 8px}
.tag svg{width:13px;height:13px}
.tag.dd{background:var(--primary-l);color:var(--primary-d)}
.tag.od{background:var(--card);color:var(--warn-d);border:1.6px solid var(--warn);padding:1px 7px}
.tag.hi{color:var(--warn-d);background:var(--warn-l)}
.row.overdue.red .ttl{color:var(--warn-d)}
.row.overdue .ck .box{border-style:dashed;border-color:var(--warn)}
.more{width:40px;height:44px;display:grid;place-items:center;color:var(--ink2);flex:none}
.more svg{width:22px;height:22px}
.empty{color:var(--ink2);font-size:14.5px;padding:10px 4px 6px;text-align:center}
.addrow{display:flex;align-items:center;gap:8px;padding:8px 0 4px}
.addrow input{flex:1;min-width:0;height:50px;border-radius:16px;border:1.8px solid var(--border2);background:var(--card);padding:0 14px;outline:none;font-size:16.5px}
.addrow input:focus{border-color:var(--primary)}
.btn{height:50px;border-radius:17px;padding:0 18px;font-family:var(--fh);font-weight:800;font-size:18px;background:var(--primary);color:var(--onp);box-shadow:0 3px 0 var(--primary-d)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--primary-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.8px solid var(--border2);box-shadow:0 2px 0 var(--border)}
.btn.danger{background:var(--card);color:var(--warn-d);border:1.8px solid var(--warn);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.45;box-shadow:none}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:2px 0 4px;flex-wrap:wrap}
.pillred{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--warn-d);background:var(--warn-l);border-radius:11px;padding:4px 9px;white-space:nowrap}
.pillred svg{width:15px;height:15px}
.overbox{border-bottom:1.5px dashed var(--border2);margin-bottom:6px;padding-bottom:4px}
/* drag */
.dragghost{position:fixed;z-index:200;pointer-events:none;box-shadow:0 14px 30px rgba(80,40,20,.2);border-radius:16px;transform:rotate(1.5deg) scale(1.02);opacity:.97}
.row.dragging{opacity:.35}
/* bottom nav + fab */
.nav{position:absolute;left:12px;right:12px;bottom:calc(10px + var(--sab));z-index:50;display:flex;background:var(--card);border:1.8px solid var(--border);border-radius:26px;padding:6px;box-shadow:0 8px 24px rgba(120,60,40,.12)}
.nav button{flex:1;display:flex;align-items:center;justify-content:center;border-radius:19px;color:var(--ink2);min-height:52px}
.nav button svg{width:27px;height:27px}
.nav button span{max-width:100%;padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.nav button[aria-current="page"]{background:var(--primary-l);color:var(--primary-d)}
.fab{position:absolute;right:14px;bottom:calc(88px + var(--sab));z-index:51;width:80px;height:74px;color:var(--primary);filter:drop-shadow(0 3px 0 var(--primary-d)) drop-shadow(0 8px 12px rgba(120,60,40,.22))}
.fab svg.pawbg{position:absolute;inset:0;width:100%;height:100%}
.fab svg.plus{position:absolute;width:28px;height:28px;left:50%;top:67%;transform:translate(-50%,-50%);color:var(--onp)}
.fab:active{transform:translateY(2px)}
/* toast */
#composer .cscrim{position:absolute;inset:0;background:rgba(18,10,8,.9);z-index:90;animation:fade .18s ease-out}
#composer .cbox{position:absolute;left:14px;right:14px;top:calc(var(--sat) + 70px);z-index:91;background:var(--card);border:2px solid var(--primary);border-radius:26px;padding:12px 14px 14px;box-shadow:0 18px 40px rgba(0,0,0,.35);animation:rise .22s cubic-bezier(.2,.8,.2,1)}
#composer .chead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#composer .chead img{width:58px;margin:-26px 0 -4px}
#composer .ct{flex:1;min-width:0}#composer .ct b{display:block;font-family:var(--fh);font-size:17px}#composer .ct small{color:var(--mint-d);font-weight:800;font-size:13px}
#composer .crow{display:flex;gap:8px}
#composer input{flex:1;min-width:0;height:56px;border-radius:18px;border:2px solid var(--primary);background:var(--accent-l);padding:0 16px;outline:none;font-size:17.5px;font-weight:700}
#composer .cadd{width:56px;height:56px;border-radius:18px;background:var(--primary);color:var(--onp);display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--primary-d)}
#composer .cadd svg{width:28px;height:28px}
@keyframes fade{from{opacity:0}}@keyframes rise{from{opacity:0;transform:translateY(-14px) scale(.98)}}
#toast{position:absolute;left:14px;right:14px;bottom:calc(96px + var(--sab));z-index:300;display:flex;align-items:center;gap:10px;background:#4A2C24;color:#fff;border-radius:18px;padding:6px 6px 6px 16px;min-height:52px;transform:translateY(30px);opacity:0;pointer-events:none;transition:transform .25s,opacity .2s;font-size:15px;font-weight:700}
#toast.show{transform:none;opacity:1;pointer-events:auto}
#toast span{flex:1}
#toast button{color:#FFC7B6;font-family:var(--fh);font-weight:800;font-size:16px;padding:10px 12px}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(60,30,20,.32);z-index:100;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:101;background:var(--card);border-radius:30px 30px 0 0;border:1.8px solid var(--border);border-bottom:0;max-height:92%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);padding-bottom:var(--sab)}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:6px;border-radius:3px;background:var(--border2);margin:9px auto 2px;flex:none}
.sheet .sh{display:flex;align-items:center;padding:4px 10px 4px 20px;flex:none}
.sheet .sh h3{flex:1;margin:0;font-size:22px}
.sheet .sb{overflow-y:auto;padding:4px 20px 20px}
.sheet .shimg{position:absolute;right:58px;top:-62px;width:96px}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--line)}
.iconbtn svg{width:26px;height:26px}
.menu button.mi{display:flex;align-items:center;gap:14px;width:100%;min-height:52px;padding:0 6px;border-radius:14px;font-weight:700;font-size:16.5px;text-align:left}
.menu button.mi:active{background:var(--accent-l)}
.menu button.mi svg{width:23px;height:23px;color:var(--ink2)}
.menu button.mi.red,.menu button.mi.red svg{color:var(--warn-d)}
.field{margin-bottom:14px}
.field label.l{display:block;font-size:14px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.inp{width:100%;min-height:50px;border-radius:16px;border:1.8px solid var(--border);background:var(--accent-l);padding:11px 14px;outline:none;font-size:16.5px}
.inp:focus{border-color:var(--primary)}
textarea.inp{min-height:84px;resize:vertical}
.hint{font-size:12.5px;color:var(--ink2);margin-top:5px}
.box2{border:1.8px solid var(--border);border-radius:20px;padding:2px 14px;background:var(--card)}
.line{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1.5px solid var(--border)}
.line:last-child{border-bottom:0}
.line .lt{flex:1;font-weight:700;font-size:16px}
.line .lt small{display:block;font-weight:600;color:var(--ink2);font-size:12.5px}
.line .val{color:var(--ink2);font-weight:700;font-size:15px}
.line input[type=time],.line input[type=date],.line select{border:1.8px solid var(--border);border-radius:13px;background:var(--accent-l);padding:7px 10px;min-height:42px}
.line svg{width:18px;height:18px;color:var(--ink2);flex:none}
.sw{position:relative;width:54px;height:32px;flex:none}
.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer;z-index:1}
.sw i{position:absolute;inset:0;background:var(--border);border-radius:16px;transition:.2s}
.sw i:after{content:"";position:absolute;width:26px;height:26px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:var(--mint)}
.sw input:checked+i:after{transform:translateX(22px)}
.sw input:focus-visible+i{outline:2px solid var(--primary);outline-offset:2px}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{width:44px;height:44px;border-radius:50%;font-family:var(--fh);font-weight:800;font-size:15px;background:var(--accent-l);color:var(--ink);border:1.5px solid var(--border)}
.days button[aria-pressed="true"]{background:var(--primary);color:var(--onp);border-color:var(--primary)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{height:42px;padding:0 15px;border-radius:15px;background:var(--accent-l);font-family:var(--fh);font-weight:800;font-size:16px;border:1.5px solid var(--border)}
.chips button[aria-pressed="true"]{background:var(--primary);color:var(--onp);border-color:var(--primary)}
.rowbtns{display:flex;gap:10px;margin-top:12px}
.rowbtns .btn{flex:1}
.banner{background:var(--warn-l);border-radius:14px;padding:10px 12px;font-size:14px;margin:6px 0 10px}
/* timeline */
.tlmonth{font-family:var(--fh);font-weight:800;font-size:14px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px;margin:14px 4px 6px}
.tlg .gh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tlg .gh .face{width:26px;height:26px}
.tlg .gh b{flex:1;font-family:var(--fh);font-size:17px}
.tlg .gh span{font-size:14px;color:var(--ink2);font-weight:800}
.tlbar{display:flex;gap:8px;align-items:center;margin:2px 0 10px;flex-wrap:wrap}
/* settings */
.set h4{font-family:var(--fh);margin:10px 4px 6px;font-size:15px;color:var(--ink2);text-transform:uppercase;letter-spacing:.4px}
.set .card{padding:2px 16px}
.set .line{min-height:56px}
.linkbtn{width:100%;text-align:left}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.thc{border:2px solid var(--border);border-radius:18px;padding:10px 10px 9px;text-align:left;background:var(--card);position:relative}
.thc[aria-pressed="true"]{border-color:var(--primary-d);box-shadow:0 0 0 3px var(--primary-l)}
.thc .dots3{display:flex;margin-bottom:6px}
.thc .dots3 i{width:28px;height:28px;border-radius:50%;margin-right:-7px;border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.thc b{font-family:var(--fh);font-size:15.5px;display:block}
.thc .ok{position:absolute;right:9px;top:9px;width:24px;height:24px;border-radius:50%;background:var(--primary-d);display:none;place-items:center}
.thc .ok svg{width:16px;height:16px}
.thc[aria-pressed="true"] .ok{display:grid}

.protag{position:absolute;right:9px;top:10px;display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:900;color:var(--primary-d);background:var(--primary-l);border-radius:8px;padding:2px 6px}
.protag svg{width:12px;height:12px}
.thc[aria-pressed="true"] .protag{display:none}
.plans{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.plan{position:relative;display:flex;align-items:center;gap:12px;padding:14px 14px;border-radius:20px;border:2px solid var(--border);background:var(--card);text-align:left}
.plan[aria-pressed="true"]{border-color:var(--primary-d);box-shadow:0 0 0 3px var(--primary-l)}
.plan .pr{width:24px;height:24px;border-radius:50%;border:2.4px solid var(--border2);display:grid;place-items:center;flex:none}
.plan[aria-pressed="true"] .pr{border-color:var(--primary-d)}.plan[aria-pressed="true"] .pr i{width:12px;height:12px;border-radius:50%;background:var(--primary-d)}
.plan .pn{flex:1;min-width:0}.plan .pn b{display:block;font-family:var(--fh);font-size:18px;line-height:1.1}.plan .pn small{color:var(--ink2);font-weight:700;font-size:13px}
.plan .pp{font-family:var(--fh);font-weight:800;font-size:19px}
.pbadge{position:absolute;top:-11px;left:16px;background:var(--primary);color:var(--onp);font-size:11.5px;font-weight:900;border-radius:9px;padding:2px 8px}
.legal{font-size:12px;color:var(--ink2);text-align:center;margin:10px 6px 14px;line-height:1.45}.legal a{color:var(--primary-d);font-weight:800}
.consent{display:flex;gap:10px;align-items:flex-start;text-align:left;max-width:330px;margin:-10px 0 22px;font-size:14.5px;color:var(--ink2);cursor:pointer}
.consent input{width:22px;height:22px;accent-color:var(--primary-d);flex:none;margin:0}
.pro{display:grid;grid-template-columns:1fr 60px 60px;font-size:15px}
.pro div{padding:10px 4px;border-bottom:1.5px solid var(--border)}
.pro .h{font-weight:800;color:var(--ink2);font-size:13px}
.pro .c{text-align:center;font-weight:800}
/* onboarding */
.onb{position:absolute;inset:0;z-index:400;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px calc(28px + var(--sab));text-align:center}
.onb img{width:250px;max-width:70%}
.onb h2{font-size:30px;margin:18px 0 8px;line-height:1.15}
.onb p{color:var(--ink);opacity:.85;font-size:17px;margin:0 0 26px;max-width:330px}
.dots{display:flex;gap:7px;margin-bottom:24px}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--border2)}
.dots i.on{width:28px;background:var(--primary)}
.onb .skipw{position:absolute;top:calc(14px + var(--sat));left:14px;right:14px;display:flex;justify-content:flex-end}
.skipb{height:44px;border-radius:22px;padding:0 20px;border:1.8px solid var(--border2);background:var(--card);font-family:var(--fh);font-weight:800;font-size:17px}
/* animation */
.anim .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.anim .jump{animation:jump .8s ease-out 1}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-2px) scale(1.015,.99)}}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-16px)}70%{transform:translateY(0)}85%{transform:translateY(-4px)}100%{transform:translateY(0)}}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:250;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:3px;animation:fall 1.5s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
[data-view="timeline"] .grip{display:none}
:focus-visible{outline:2.5px solid var(--primary-d);outline-offset:2px}
</style>

  if(isRep(x)){x.doneDates=x.doneDates||{};if(x.doneDates[ds])delete x.doneDates[ds];else x.doneDates[ds]=Date.now();nowDone=!!x.doneDates[ds]}
  else{x.done=!x.done;x.completedAt=x.done?Date.now():null;nowDone=x.done}

  if(nowDone){haptic();const st=ds?dayStat(ds):null;track("task_complete",{repeat:isRep(x)?1:0,list:ds?"day":"someday"});
    if(st&&st.status==="complete"&&before!=="complete"){U.flash="alldone";track("day_complete",{tasks:st.n});setTimeout(()=>{confetti();haptic("success");meow()},120)}
    else U.flash="single";
    clearTimeout(U.flashT);U.flashT=setTimeout(()=>{U.flash=null;renderHero()},3500);
    toast(t("t_done",{t:x.title}),()=>restore(snap))}
  render();
}

    done:!!(x.doneDates&&x.doneDates[ds]),date:ds,...overrides});

  else{x.date=toDs;if(!toDs){x.reminder=null;x.repeat={type:"none",days:[],end:null}}if(opts.order!=null)x.order=opts.order;touch(x)}}

  const go=()=>{const snap=snapshot();moveTask(id,fromDs,toDs);track("task_move",{to:toDs?(toDs===addDays(fromDs||todayStr(),1)?"tomorrow":"date"):"someday"});save();render();toast(t("t_moved",{t:x.title}),()=>restore(snap))};
  if(!toDs&&x.reminder)confirmSheet(t("confirmReminder"),go);else go()}

  U.drag={row,gh,dy:ev.clientY-r.top,target:null,y:ev.clientY,cell:null,moved:false};
  document.querySelectorAll('ul.list[data-list="someday"],ul.list[data-list="day"]').forEach(l=>l.classList.add("dz"));
  const mv=e=>{if(!U.drag)return;U.drag.y=e.clientY;U.drag.moved=true;gh.style.top=(e.clientY-U.drag.dy)+"px";hover(e.clientX,e.clientY)};
  const off=()=>{window.removeEventListener("pointermove",mv);window.removeEventListener("pointerup",up);window.removeEventListener("pointercancel",cancel);cancelAnimationFrame(U.drag&&U.drag.raf)};
  const up=()=>{off();drop()};const cancel=()=>{off();abort()};
  window.addEventListener("pointermove",mv);window.addEventListener("pointerup",up);window.addEventListener("pointercancel",cancel);
  const main=$("#main");const auto=()=>{if(!U.drag||!main)return;const mr=main.getBoundingClientRect();const y=U.drag.y;
    if(y<mr.top+70)main.scrollTop-=10;else if(y>mr.bottom-150)main.scrollTop+=10;U.drag.raf=requestAnimationFrame(auto)};U.drag.raf=requestAnimationFrame(auto)}
function hover(x,y){const D=U.drag;D.gh.style.display="none";const el=document.elementFromPoint(x,y);D.gh.style.display="";
  document.querySelectorAll(".dcell.drop,.list.over").forEach(n=>n.classList.remove("drop","over"));D.cell=null;D.target=null;
  if(!el)return;const cell=el.closest(".dcell");if(cell){cell.classList.add("drop");D.cell=cell.dataset.date;return}
  let list=el.closest('ul.list[data-list="someday"],ul.list[data-list="day"]');
  if(!list){const sec=el.closest("section");if(sec)list=sec.querySelector('ul.list[data-list="someday"],ul.list[data-list="day"]')}
  if(!list)return;list.classList.add("over");D.target=list;
  const rows=[...list.querySelectorAll(".row")].filter(r=>r!==D.row);let before=null;for(const r of rows){const b=r.getBoundingClientRect();if(y<b.top+b.height/2){before=r;break}}
  if(before)list.insertBefore(D.row,before);else list.appendChild(D.row)}
function cleanupDrag(){const D=U.drag;if(!D)return;D.gh.remove();D.row.classList.remove("dragging");document.querySelectorAll(".dz,.over,.drop").forEach(n=>n.classList.remove("dz","over","drop"));setTimeout(()=>{U.drag=null},0)}
function abort(){if(!U.drag)return;cleanupDrag();render()}
function drop(){const D=U.drag;if(!D)return;const id=D.row.dataset.id,ds=D.row.dataset.ds||null;const x=byId(id);
  if(!D.moved){cleanupDrag();render();return}
  if(D.cell){cleanupDrag();if(D.cell!==ds)doMove(id,ds,D.cell);else render();return}
  if(!D.target){cleanupDrag();render();return}
  const kind=D.target.dataset.list;const toDs=kind==="someday"?null:U.sel;
  const ids=[...D.target.querySelectorAll(".row")].map(r=>r.dataset.id);cleanupDrag();
  const apply=()=>{const snap=snapshot();
    const sameDay=(kind==="someday"&&!x.date)||(kind==="day"&&(isRep(x)?ds===U.sel:x.date===U.sel));
    if(!sameDay)moveTask(id,ds,toDs);
    const list=kind==="someday"?somedayTasks():tasksOn(U.sel);const newId=sameDay?id:(list.find(z=>!ids.includes(z.id))||{}).id;
    ids.forEach((tid,i)=>{const real=byId(tid===id?newId||id:tid);if(real)real.order=(i+1)*10});
    save();render();if(!sameDay)toast(t("t_moved",{t:x.title}),()=>restore(snap))};
  if(kind==="someday"&&x.date&&x.reminder)confirmSheet(t("confirmReminder"),apply,()=>render());else apply()}

/* ============ notifications ============ */
const LN=()=>P("LocalNotifications");
async function permState(){try{if(isNative&&LN()){const r=await LN().checkPermissions();return r.display==="granted"?"granted":r.display==="denied"?"denied":"prompt"}
  if("Notification"in window)return Notification.permission==="default"?"prompt":Notification.permission}catch(e){}return "denied"}
async function ensurePermission(ask){let s=await permState();if(s==="prompt"&&ask){try{if(isNative&&LN()){const r=await LN().requestPermissions();s=r.display==="granted"?"granted":"denied"}
  else if("Notification"in window){const r=await Notification.requestPermission();s=r==="granted"?"granted":r==="denied"?"denied":"prompt"}}catch(e){}}
  scheduleNotifs();return s}
async function updatePermState(){const el=$("#permState");if(el)el.textContent=t("perm_"+await permState())}
function hm(s){const[a,b]=s.split(":").map(Number);return[a,b]}
function hashId(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return Math.abs(h)%2000000000+1}
function upcoming(){const now=new Date(),td=todayStr(),out=[];
  for(let i=0;i<14;i++){const ds=addDays(td,i);for(const x of tasksOn(ds)){if(!x.reminder||isDone(x,ds))continue;const[h,m]=hm(x.reminder);const at=parse(ds);at.setHours(h,m,0,0);
      if(at>now)out.push({id:hashId(x.id+ds),title:t("remindTitle"),body:x.title,at,extra:{taskId:x.id,date:ds}})}}
  if(S.settings.brief){const[h,m]=hm(S.settings.briefTime);for(let i=0;i<7;i++){const ds=addDays(td,i);const at=parse(ds);at.setHours(h,m,0,0);if(at<=now)continue;
      const l=tasksOn(ds),n=l.length,p=l.filter(x=>x.pin).length+somedayTasks().filter(x=>x.pin&&!x.done).length;
      out.push({id:hashId("brief"+ds),title:"Fat Cat Todo 🐾",body:t("brief",{n,p:p?t("briefPin",{p}):""}),at,extra:{brief:true,date:ds}})}}
  return out.sort((a,b)=>a.at-b.at).slice(0,60)}
let schedT,webTimers=[];
function scheduleNotifs(){clearTimeout(schedT);schedT=setTimeout(()=>{doSchedule();pushWidget()},600)}
/* Android home-screen widget: send a 7-day snapshot to native SharedPreferences */
function widgetPayload(){const td=todayStr(),days={};
  for(let i=0;i<7;i++){const ds=addDays(td,i);const l=tasksOn(ds);days[ds]={label:longDate(ds),total:l.length,done:l.filter(x=>isDone(x,ds)).length,items:l.slice(0,6).map(x=>({t:x.title,d:isDone(x,ds)}))}}
  const th=THEMES.find(x=>x.id===S.settings.palette)||THEMES[0];
  return {v:1,emptyText:t("w_empty"),openText:t("w_open"),accent:themeVars(th,false)["primary-d"],days}}
function pushWidget(){const W=P("WidgetBridge");if(!W)return;try{W.update({data:JSON.stringify(widgetPayload())}).catch(()=>{})}catch(e){}}
async function doSchedule(){const list=upcoming();
  if(isNative&&LN()){try{const st=await permState();const pend=await LN().getPending();if(pend.notifications&&pend.notifications.length)await LN().cancel({notifications:pend.notifications.map(n=>({id:n.id}))});
      if(st!=="granted"||!list.length)return;
      await LN().schedule({notifications:list.map(n=>({id:n.id,title:n.title,body:n.body,schedule:{at:n.at,allowWhileIdle:true},extra:n.extra,channelId:"fatcat",smallIcon:"ic_stat_cat"}))})}catch(e){console.warn("notif",e)}return}
  webTimers.forEach(clearTimeout);webTimers=[];if(!("Notification"in window))return;const now=Date.now();
  list.filter(n=>n.at-now<864e5).forEach(n=>webTimers.push(setTimeout(()=>{if(Notification.permission==="granted"){const no=new Notification(n.title,{body:n.body,tag:String(n.id)});no.onclick=()=>{window.focus();openFromNotif(n.extra)}}else toast(n.title+" "+n.body)},n.at-now)))}
function openFromNotif(ex){if(!ex)return;closeAll();U.view="home";if(ex.date)U.sel=U.cursor=ex.date;render();if(ex.taskId&&byId(ex.taskId))setTimeout(()=>editor(ex.taskId,ex.date),300)}

/* ============ Google Play Billing (native BillingPlugin) ============ */
const BILL=()=>P("Billing");
function setPro(v){const was=S.pro;S.pro=!!v;if(!S.pro&&!unlocked(S.settings.palette))S.settings.palette=FREE_THEME;if(S.pro&&U.preview){S.settings.palette=U.preview;U.preview=null}
  save();if(was!==S.pro){analyticsSync();render()}}
async function loadProducts(){const B=BILL();if(!B)return;try{U.products=await B.getProducts();if(U.view==="premium")render()}catch(e){console.warn("billing products",e)}}
async function refreshPro(manual){const B=BILL();if(!B){if(manual)toast(t("pw_webonly"));return}
  try{const r=await B.getEntitlement();setPro(r.pro);if(manual){toast(r.pro?t("pw_restored"):t("pw_none"));track("restore_purchases",{found:r.pro?1:0})}}
  catch(e){if(manual)toast(t("pw_unavail"))}}
async function buyPro(){const B=BILL();const plan=U.plan;if(!B){toast(t("pw_webonly"));return}
  if(!U.products||!U.products[PRODUCTS[plan]])await loadProducts();
  track("purchase_start",{plan});U.buying=true;render();
  try{const r=await B.purchase({productId:PRODUCTS[plan]});
    if(r.status==="purchased"||r.status==="owned"){await refreshPro();if(S.pro){toast(t("pw_thanks"));confetti();haptic("success");track("purchase_success",{plan})}}
    else if(r.status==="pending"){toast(t("pw_pending"));track("purchase_pending",{plan})}
    else if(r.status==="cancelled")track("purchase_cancel",{plan});
    else{toast(t("pw_error"));track("purchase_error",{plan,code:String(r.message||"").slice(0,90)})}}
  catch(e){toast(t("pw_unavail"));track("purchase_error",{plan,code:"unavailable"})}
  U.buying=false;render()}

/* ============ data ============ */
async function exportData(){const data=JSON.stringify({app:"fatcat-todo",version:1,exportedAt:new Date().toISOString(),tasks:S.tasks,settings:S.settings},null,2);
  const name=`fatcat-todo-${todayStr()}.json`;const FS=P("Filesystem"),SH=P("Share");
  if(isNative&&FS){try{const r=await FS.writeFile({path:name,data,directory:"CACHE",encoding:"utf8"});if(SH)await SH.share({title:name,url:r.uri});else toast(name);return}catch(e){console.warn(e)}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function importData(file){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.tasks))throw 0;
  const known=new Set(S.tasks.map(x=>x.id));let n=0;o.tasks.forEach(x=>{if(x&&x.id&&x.title&&!known.has(x.id)){S.tasks.push(newTask(x));n++}});
  if(o.settings)S.settings={...S.settings,...o.settings};save();render();toast(t("imported",{n}))}catch(e){toast(t("importErr"))}};r.readAsText(file)}

/* ============ boot ============ */
async function boot(){
  render();
  if(isNative){
    const A=P("App");if(A){A.addListener("backButton",()=>{if($(".onb"))return;if(U.stack.length)closeSheet();else if(U.adding){U.adding=null;render()}else if(U.view!=="home"){U.view=U.view==="premium"?"more":"home";render()}else A.minimizeApp?A.minimizeApp():A.exitApp()});
      A.addListener("resume",()=>{render();scheduleNotifs()})}
    const L=LN();if(L){try{await L.createChannel({id:"fatcat",name:"Fat Cat Todo",description:"Reminders & daily brief",importance:4,visibility:1,vibration:true})}catch(e){}
      L.addListener("localNotificationActionPerformed",a=>openFromNotif(a.notification&&a.notification.extra))}
    const SP=P("SplashScreen");if(SP)try{SP.hide()}catch(e){}
    const WB=P("WidgetBridge");if(WB)WB.appInfo().then(r=>{U.debug=!!r.debug}).catch(()=>{});
    loadProducts();refreshPro();if(A)A.addListener("resume",()=>refreshPro());
  }
  analyticsSync();track("app_open_fatcat",{tasks:live().length,pro:S.pro?1:0});
  scheduleNotifs();
  let last=todayStr();setInterval(()=>{const n=todayStr();if(n!==last){if(U.sel===last)U.sel=U.cursor=n;last=n;render();scheduleNotifs()}},30000);
  const mq=matchMedia("(prefers-color-scheme: dark)");mq.addEventListener&&mq.addEventListener("change",()=>applyTheme());
}
boot();
</script>
